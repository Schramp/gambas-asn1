[package]
name = "contact-book-rust-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "gambas-asn1#299: best-effort --target=rust build of the book-tutorial contact-book schema (doc/book.md), tracking Rust codegen coverage for OPTIONAL members, nested SEQUENCE, and SEQUENCE OF — none of which are in RustBackend's table-driven scope yet. Generated by `make rust-probe` in the parent directory — not wired into ctest/CI."

[lib]
path = "src/lib.rs"

[dependencies]
asn1cpp-ber = { path = "../../../rust-runtime/ber" }
