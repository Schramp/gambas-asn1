[package]
name = "per-nkm-size-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the PER SIZE-on-non-known-multiplier-strings test (per_nkm_size_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR and the expected mode from NKM_MODE (set by tests/CMakeLists.txt's rust_per_nkm_size_*), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "per_nkm_size"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
