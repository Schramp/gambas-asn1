[package]
name = "xer-value-list-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the XER XMLValueList test (xer_value_list_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_xer_value_list), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "xer_value_list"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
