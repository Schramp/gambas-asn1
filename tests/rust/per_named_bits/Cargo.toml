[package]
name = "per-named-bits-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the NamedBitList BIT STRING PER test (per_named_bits_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_per_named_bits), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "per_named_bits"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
