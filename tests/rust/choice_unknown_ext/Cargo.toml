[package]
name = "choice-unknown-ext-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the unknown CHOICE extension alternative test (per_choice_unknown_ext_test.asn1). Pulls generated .rs from ASN1CPP_RUST_CUE_GEN_DIR (set by tests/CMakeLists.txt's rust_choice_unknown_ext), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "choice_unknown_ext"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
