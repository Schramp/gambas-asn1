[package]
name = "size-lower-bound-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the SIZE(lb..MAX) / 64K-edge test (size_lower_bound_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_size_lower_bound), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "size_lower_bound"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
