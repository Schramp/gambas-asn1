[package]
name = "enum-item-names-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the ENUMERATED item names test (enum_item_names_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_enum_item_names), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "enum_item_names"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
