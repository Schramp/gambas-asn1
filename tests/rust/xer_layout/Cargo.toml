[package]
name = "xer-layout-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the XER layout test (xer_layout_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_xer_layout), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "xer_layout"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
