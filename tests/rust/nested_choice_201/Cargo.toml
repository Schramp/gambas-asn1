[package]
name = "nested-choice-201-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "gambas-asn1#437: Rust codegen for a deeply nested anonymous CHOICE-in-CHOICE (201-nested-choice-name-collision-OK.asn1) — a promoted 0-member SEQUENCE {} synthetic type used to fail to implement Asn1Value at all (E0277), breaking the build. Pulls generated .rs from ASN1CPP_RUST_NC201_GEN_DIR (set by tests/CMakeLists.txt's rust_nested_choice_201) — needs that env var set, so this isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "nested_choice_201"
path = "src/main.rs"

[dependencies]
asn1cpp-ber = { path = "../../../rust-runtime/ber" }
