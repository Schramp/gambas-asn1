[package]
name = "ber-vectors-62-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "gambas-asn1#323: decode/re-encode every real asn1c data-62 BER fixture against compiler-generated 62-any-OK.asn1 types, mirroring tests/seq/test_ber_vectors_62.cpp's check-62.c semantics. build.rs pulls the generated T.rs/T1Ext.rs/T2.rs/T2M3.rs/T3.rs/T4.rs/lib.rs from the directory named by ASN1CPP_RUST_BV62_GEN_DIR (set by tests/CMakeLists.txt's rust_ber_vectors_62) — needs that env var set, so this isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "ber_vectors_62"
path = "src/main.rs"

[dependencies]
asn1cpp-ber = { path = "../../../rust-runtime/ber" }
