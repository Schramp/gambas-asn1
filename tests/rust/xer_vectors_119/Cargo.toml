[package]
name = "xer-vectors-119-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "decode/UPER-encode/UPER-decode/re-encode every real asn1c data-119 fixture against compiler-generated 119-per-strings-OK.asn1 types, mirroring tests/seq/test_xer_vectors_119.cpp's check-119.c semantics. build.rs pulls the generated PDU.rs/PDUMany.rs/lib.rs from the directory named by ASN1CPP_RUST_XV119_GEN_DIR (set by tests/CMakeLists.txt's rust_xer_vectors_119) — needs that env var set, so this isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "xer_vectors_119"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
