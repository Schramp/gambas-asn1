[package]
name = "typedef-tag-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the type-assignment tag test (typedef_tag_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_typedef_tag), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "typedef_tag"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
