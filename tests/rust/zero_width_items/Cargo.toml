[package]
name = "zero-width-items-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the PER zero-width SEQUENCE OF items test (zero_width_items_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_zero_width_items), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "zero_width_items"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
