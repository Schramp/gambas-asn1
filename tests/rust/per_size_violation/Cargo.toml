[package]
name = "per-size-violation-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the PER SIZE-violation test (per_size_violation_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_per_size_violation), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "per_size_violation"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
