[package]
name = "ext-group-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the extension addition group test (per_ext_group_test.asn1). Pulls generated .rs from ASN1CPP_RUST_EXTGRP_GEN_DIR (set by tests/CMakeLists.txt's rust_ext_group), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "ext_group"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
