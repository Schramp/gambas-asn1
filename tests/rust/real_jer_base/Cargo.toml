[package]
name = "real-jer-base-test"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Rust leg of the REAL JER base-constraint test (real_jer_base_test.asn1). Pulls generated .rs from ASN1CPP_RUST_GEN_DIR (set by tests/CMakeLists.txt's rust_real_jer_base), so it isn't meant to be built with a bare `cargo build`."

[[bin]]
name = "real_jer_base"
path = "src/main.rs"

[dependencies]
asn1cpp-wire = { path = "../../../rust-runtime/wire" }
