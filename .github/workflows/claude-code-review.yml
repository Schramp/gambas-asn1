name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          allowed_tools: "Bash(gh:*),Glob,Grep,LS,Read,mcp__github_comment__update_claude_comment,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the diff.
            2. Run `gh pr view ${{ github.event.pull_request.number }}` to get the PR description.
            3. Read any changed source files relevant to understanding the diff.
            4. Post your review via `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.

            Focus on: correctness bugs, missing edge cases, API/ABI breaks, missing tests, doc gaps.
            Skip style nits unless they affect correctness.
            Be concise — one line per finding: file:line problem. fix.
