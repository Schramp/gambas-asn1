name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash,Read,WebFetch'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Steps:
            1. Fetch the diff: gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
            2. Read any changed files you need for full context.
            3. Post your review with:
               gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --comment --body "YOUR_REVIEW_HERE"

            Focus on: correctness, missing test coverage, potential bugs, and API/interface issues.
            Be concise. Skip praise. Only flag real issues or noteworthy observations.
