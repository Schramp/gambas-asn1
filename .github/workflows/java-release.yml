name: java-release

# Publishes java-runtime (io.github.schramp.gambasasn1:gambasasn1-wire) to
# Maven Central through the Central Portal, from the release tag vX.Y.Z.
# The release workflow (release.yml) calls it after pushing that tag; run it
# by hand with a version to publish an existing tag again.
#
# Repository secrets it needs:
#   CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD  Central Portal user token
#   SIGNING_KEY, SIGNING_PASSWORD                   ASCII-armoured PGP key and its passphrase
#
# The upload is USER_MANAGED: the Portal validates the bundle, and the
# release is published from the Portal's Deployments page.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (X.Y.Z; tag vX.Y.Z must exist)'
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The version reaches every later step through env: only, never through
      # ${{ }} inside a script, and must be plain X.Y.Z: a dispatch input is
      # text a writer chose, and may hold ; $( ) or `.
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if ! printf '%s' "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "not a release version (X.Y.Z): '$v'"; exit 1
          fi
          # The runtime is released only together with its compiler version.
          if [ "$v" != "$(cat VERSION)" ]; then
            echo "release version $v differs from VERSION ($(cat VERSION))"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test and stage the signed bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingKey" || { echo "SIGNING_KEY secret missing"; exit 1; }
          ./java-runtime/gradlew -p java-runtime test publishWirePublicationToStagingRepository \
              -Pversion="$VERSION"
          cd java-runtime/build/staging-deploy
          ls io/github/schramp/gambasasn1/gambasasn1-wire/"$VERSION"/*.asc
          zip -r ../bundle.zip . -x '*maven-metadata*'

      - name: Upload to the Central Portal
        env:
          USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $token" \
              -F bundle=@java-runtime/build/bundle.zip \
              "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED&name=gambasasn1-wire-$VERSION"
